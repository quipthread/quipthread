<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quipthread Embed — Dev</title>
  </head>
  <body>
    <div
      data-quipthread
      data-site-id="dev-site"
      data-page-id="/dev/test-page"
      data-page-url="http://localhost:5173/dev/test-page"
      data-page-title="Test Page"
      data-lang="en"
      data-theme="auto"
    ></div>
    <!-- Production pages load /embed.js, which imports the widget module and
         calls start(); in dev the module is started directly. -->
    <script type="module">
      import { start } from '/src/main.tsx'

      start({ apiBase: 'http://localhost:8080', queued: [] })
    </script>
  </body>
</html>
